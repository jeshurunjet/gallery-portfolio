spring.application.name=portfolio

server.port=${PORT:8080}

# Database
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=${HIBERNATE_DDL_AUTO:validate}
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}

# Upload limits
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
spring.web.resources.static-locations=file:uploads/

# Cloudinary
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# Mail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_APP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# App config
app.admin-email=${ADMIN_EMAIL}
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.registration-enabled=${REGISTRATION_ENABLED:false}
app.jwt-secret=${JWT_SECRET}
app.webauthn-rp-id=${WEBAUTHN_RP_ID:localhost}
app.webauthn-rp-name=${WEBAUTHN_RP_NAME:Jesh Portfolio Admin}
app.webauthn-origins=${WEBAUTHN_ORIGINS:http://localhost:5173}
