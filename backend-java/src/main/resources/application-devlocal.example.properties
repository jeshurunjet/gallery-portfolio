spring.application.name=portfolio

server.port=8080

# Local dev database
spring.datasource.url=jdbc:h2:file:./data/portfolio-devlocal;MODE=PostgreSQL;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Upload limits
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
spring.web.resources.static-locations=file:uploads/

# Cloudinary
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:test}
cloudinary.api-key=${CLOUDINARY_API_KEY:test}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:test}

# Mail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:test}
spring.mail.password=${MAIL_APP_PASSWORD:test}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# App config
app.admin-email=${ADMIN_EMAIL:local@example.com}
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.registration-enabled=${REGISTRATION_ENABLED:true}
